apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snowplow.fullname" . }}
  labels:
    {{- include "snowplow.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "snowplow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ printf "%s%s" (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/configmap.jq-custom-modules.yaml") .) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "snowplow.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snowplow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "snowplow.fullname" . }}
          envFrom:
            - configMapRef:
                name: {{ include "snowplow.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # RS256 verification keys are fetched from authn's JWKS endpoint —
            # snowplow holds no copy of authn's public key. JWT_JWKS_URL is left
            # unset by default so the binary derives it from URL_AUTHN (already in
            # the ConfigMap for the #57 token exchange); set jwt.jwksUrl only to
            # point at a different authn.
            {{- with .Values.jwt.jwksUrl }}
            - name: JWT_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            # Cache tuning: how long a fetched key set is trusted, the floor
            # between fetch attempts (throttles refetches an unknown kid would
            # trigger), and the per-fetch timeout.
            - name: JWT_JWKS_CACHE_TTL
              value: {{ .Values.jwt.cacheTTL | quote }}
            - name: JWT_JWKS_MIN_REFRESH_INTERVAL
              value: {{ .Values.jwt.minRefreshInterval | quote }}
            - name: JWT_JWKS_REQUEST_TIMEOUT
              value: {{ .Values.jwt.requestTimeout | quote }}
            # OpenTelemetry (1.12.4). Four downward-API entries, UNCONDITIONAL:
            # they are cheap, carry no secret, and gating them on OTEL_ENABLED
            # would tie the telemetry path to a template conditional the
            # installer can flip independently of the env var.
            #   HOST_IP        expands $(HOST_IP) in OTEL_EXPORTER_OTLP_ENDPOINT —
            #                  the node-local OTel collector agent (hostPort 4318)
            #                  is the ONLY OTLP ingest on the platform.
            #   POD_NAME       service.instance.id + k8s.pod.name
            #   POD_UID        k8s.pod.uid — the collector's k8sattributes
            #                  pod_association rule-2 key; without it association
            #                  falls through to source-IP matching, which the
            #                  hostPort hop can defeat (SNAT), and NOTHING is enriched.
            #   POD_NAMESPACE  service.namespace + k8s.namespace.name
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # envFrom (the ConfigMap) performs NO $(VAR) expansion — only a
            # container env: entry does, against another env: entry in the same
            # container. This entry OVERRIDES the same key from the ConfigMap and
            # only performs the expansion; values.env.OTEL_EXPORTER_OTLP_ENDPOINT
            # stays the installer-editable source of truth.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "krateo.image" (dict "img" .Values.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: jq-modules
              mountPath: /jq-modules
              readOnly: true
            # #57 — the prewarm seed's projected (audience=authn) SA token,
            # mounted at the directory of SERVICEACCOUNT_TOKEN_PATH so the
            # authn.Client reads it fresh on each exchange. UNCONDITIONAL — the
            # authn JWT is a hard platform requirement (no seedAuthn.enabled gate).
            - name: seed-authn-token
              mountPath: {{ dir .Values.seedAuthn.tokenPath | quote }}
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: jq-modules
          configMap:
            name: {{ include "snowplow.fullname" . }}-jq-custom-modules
        # #57 — projected ServiceAccount token bound to the authn audience.
        # The audience MUST be exactly the authn operator's
        # --serviceaccount-audience ("authn"); the file lands at
        # basename(SERVICEACCOUNT_TOKEN_PATH) inside the mount dir. UNCONDITIONAL
        # — the authn JWT is a hard platform requirement (no seedAuthn.enabled gate).
        - name: seed-authn-token
          projected:
            sources:
              - serviceAccountToken:
                  path: {{ base .Values.seedAuthn.tokenPath | quote }}
                  audience: {{ .Values.seedAuthn.tokenAudience | quote }}
                  expirationSeconds: 3600
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
